# SonarQube Project Configuration
sonar.projectKey=tubes-devops-web
sonar.projectName=Tubes DevOps Web
sonar.projectVersion=1.0

# Source & Test Directories
sonar.sources=app,routes,resources
sonar.tests=tests

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,bootstrap/cache/**
sonar.test.inclusions=tests/**/*Test.php

# Encoding
sonar.sourceEncoding=UTF-8
